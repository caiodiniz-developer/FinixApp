name: Jobs diários

# Dispara os jobs agendados da API (recorrências, lembretes de vencimento,
# lembrete de compra por impulso). O servidor também os roda sozinho, mas em
# hospedagem que "dorme" quando fica ociosa o timer interno não é confiável —
# esta chamada acorda a API e garante a execução uma vez por dia.
#
# Configure em Settings → Secrets and variables → Actions:
#   API_URL      ex.: https://finixapp.onrender.com
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET do backend

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/run-jobs
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL/CRON_SECRET não configurados — nada a fazer."
            exit 0
          fi
          # A instância pode estar dormindo: até 5 tentativas, 30s entre elas.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/api/cron/run-jobs" \
            -H "Authorization: Bearer $CRON_SECRET"
